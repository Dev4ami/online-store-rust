<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Toko Online{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <script src="/static/htmx.min.js" defer></script>
</head>
<body>
    <header class="site-header">
        <a class="brand" href="/">Toko&nbsp;Online</a>
        <nav>
            <a href="/">Katalog</a>
            <a href="/cart" class="cart-link">
                Keranjang
                <span id="cart-badge" class="cart-badge{% if cart_count == 0 %} hidden{% endif %}">{{ cart_count }}</span>
            </a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; Toko Online — dibuat dengan Rust.</p>
    </footer>
</body>
</html>
