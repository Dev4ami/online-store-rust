{% extends "base.html" %}

{% block title %}Daftar — {{ crate::templates::store_name() }}{% endblock %}

{% block content %}
<div class="auth-box">
    <h1>Buat Akun</h1>

    {% match error %}
        {% when Some(msg) %}<p class="form-error">{{ msg }}</p>
        {% when None %}
    {% endmatch %}

    <form action="/register" method="post" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ crate::csrf::token() }}">
        <label>Nama
            <input type="text" name="name" value="{{ name }}" placeholder="Nama kamu">
        </label>
        <label>Email
            <input type="email" name="email" value="{{ email }}" required placeholder="nama@contoh.com">
        </label>
        <label>Password
            <input type="password" name="password" required minlength="8" placeholder="Minimal 8 karakter">
        </label>
        <button type="submit" class="btn-primary">Daftar</button>
    </form>

    <p class="auth-alt">Sudah punya akun? <a href="/login">Masuk di sini</a>.</p>
</div>
{% endblock %}
