<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Admin — {{ crate::templates::store_name() }}{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="site-header admin-header">
        <a class="brand" href="/admin">Admin · {{ crate::templates::store_name() }}</a>
        <input type="checkbox" id="nav-toggle" class="nav-toggle" hidden>
        <label for="nav-toggle" class="nav-burger" aria-label="Menu">
            <span></span><span></span><span></span>
        </label>
        <nav>
            <a href="/admin/products">Produk</a>
            <a href="/admin/orders">Pesanan</a>
            <a href="/">&larr; ke Toko</a>
            <span class="user-greet">Halo, {{ admin_name }}</span>
            <form action="/logout" method="post" class="logout-form">
                <input type="hidden" name="csrf_token" value="{{ crate::csrf::token() }}">
                <button type="submit" class="btn-link-nav">Keluar</button>
            </form>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 {{ crate::templates::store_name() }} — panel admin.</p>
    </footer>
</body>
</html>
